<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 3 - Layout Grid</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 1.5rem;
        }

        body {
            padding: 20px;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
        }

        .grid-container {
            display: grid;
            width: 100%;
            max-width: 900px;
            height: 600px;
            gap: 15px;
            grid-template-columns: 1fr 1.5fr 1fr;
            grid-template-rows: auto 1fr 1fr auto;
            grid-template-areas: 
                "item1 item1 item1"
                "item2 item3 item4"
                "item5 item3 item6"
                "item5 item7 item7";
        }

        .item {
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .yellow { background-color: #fcd581; }
        .red { background-color: #f45b69; }

        .i1 { grid-area: item1; height: 80px; }
        .i2 { grid-area: item2; }
        .i3 { grid-area: item3; }
        .i4 { grid-area: item4; }
        .i5 { grid-area: item5; }
        .i6 { grid-area: item6; }
        .i7 { grid-area: item7; height: 100px; }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="item yellow i1">1</div>
        <div class="item red i2">2</div>
        <div class="item yellow i3">3</div>
        <div class="item red i4">4</div>
        <div class="item yellow i5">5</div>
        <div class="item red i6">6</div>
        <div class="item yellow i7">7</div>
    </div>
</body>
</html>

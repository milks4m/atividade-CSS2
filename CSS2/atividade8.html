<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade - Layout Exato da Imagem</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0f0f0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .dashboard {
            display: grid;
            width: 100%;
            max-width: 900px;
            height: 440px;
            gap: 10px;
            /* Corrigido de 'fx' para 'fr' e limpos os erros de sintaxe */
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr;
            grid-template-rows: 0.8fr 1.2fr 1fr 2fr;
            grid-template-areas: 
                "t1 t1 t1 t1 t1 t1 t2 t2"
                "t3 t3 t3 t3 t3 t4 t4 t4"
                "t3 t3 t3 t3 t3 t6 t6 t5"
                "t3 t3 t3 t3 t3 t7 t7 t5";
            background-color: white;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .tile {
            border-radius: 6px;
        }

        .c-orange-top { background-color: #f89e35; }
        .c-orange-large { background-color: #f48b5f; }
        .c-blue-top { background-color: #aed3e8; }
        .c-blue-mid { background-color: #9cbcd4; }
        .c-pink { background-color: #e5b3b3; }
        .c-green { background-color: #97b864; }
        
        .c-dots {
            background-color: #f5f5f5;
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 4px;
            padding: 6px;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        .dot {
            height: 85%;
            max-width: 22%;
            max-height: 100%;
            aspect-ratio: 1;
            border-radius: 50%;
            flex-shrink: 1;
        }

        .t1 { grid-area: t1; } 
        .t2 { grid-area: t2; } 
        .t3 { grid-area: t3; } 
        .t4 { grid-area: t4; } 
        .t5 { grid-area: t5; } 
        .t6 { grid-area: t6; } 
        .t7 { grid-area: t7; }

        @media screen and (max-width: 500px) {
            .dashboard {
                display: flex;
                flex-direction: column;
                height: auto;
            }

            .tile {
                min-height: 80px;
                width: 100%;
            }

            .c-dots {
                height: 70%;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="tile c-orange-top t1"></div>
        <div class="tile c-blue-top t2"></div>
        <div class="tile c-orange-large t3"></div>
        
        <div class="tile c-dots t4">
            <div class="dot" style="background:#97b864;"></div>
            <div class="dot" style="background:#e5b3b3;"></div>
            <div class="dot" style="background:#b8a5c9;"></div>
            <div class="dot" style="background:#f89e35;"></div>
        </div>

        <div class="tile c-green t5"></div>
        
        <div class="tile t6" style="display: flex; flex-direction: column; background: transparent;">
            <div style="flex: 1; background-color: #aed3e8; border-radius: 6px;"></div>
        </div>

        <div class="tile t7" style="display: flex; flex-direction: column; background: transparent;">
            <div style="flex: 1; background-color: #e5b3b3; border-radius: 6px;"></div>
        </div>
    </div>
</body>
</html>

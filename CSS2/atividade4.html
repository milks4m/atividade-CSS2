<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 4 - Layout Adaptativo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }

        body {
            background-color: #eaeaea;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .container {
            display: grid;
            width: 100%;
            max-width: 900px;
            gap: 8px;
            grid-template-columns: 160px 1fr 160px;
            grid-template-rows: 60px 50px 573px 60px 60px;
            grid-template-areas: 
                "header header header"
                "left-aside banner right-aside"
                "left-aside main right-aside"
                "left-aside low right-aside"
                "footer footer footer";
        }

        .box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            text-align: center;
        }

        .header { grid-area: header; background-color: #e6a100; }
        .left-aside { grid-area: left-aside; background-color: #279446; }
        .right-aside { grid-area: right-aside; background-color: #e6a100; }
        .banner { grid-area: banner; background-color: #d94336; }
        .main-content { grid-area: main; background-color: #4285f4; }
        .low-content { grid-area: low; background-color: #279446; }
        .footer { grid-area: footer; background-color: #3b73e8; }

        @media screen and (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
                grid-template-areas: 
                    "header"
                    "banner"
                    "main"
                    "low"
                    "left-aside"
                    "right-aside"
                    "footer";
            }

            .main-content {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="box header">Header</header>
        <aside class="box left-aside">Left Aside</aside>
        <div class="box banner">Banner</div>
        <main class="box main-content">
            <p>Main Content</p>
            <span style="font-size: 0.8rem; font-weight: normal; margin-top: 5px;">Width: 437, Height: 573</span>
        </main>
        <div class="box low-content">Low Content</div>
        <aside class="box right-aside">Right Aside</aside>
        <footer class="box footer">Footer</footer>
    </div>
</body>
</html>
